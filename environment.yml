name: docking-ai
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.12
  - numpy=2.4.6
  - pandas=3.0.5
  - rdkit=2026.3.5
  - pytorch=2.13.0
  - scikit-learn=1.9.0
  - matplotlib=3.11.1
  - networkx=3.6.1
  - pyyaml=6.0.3
  - tqdm=4.68.4
  - pytest=9.1.1
  - pip
  - pip:
      - meeko==0.7.1
# AutoDock Vina is not installable via conda/pip on Windows in this setup.
# Download the standalone executable from:
#   https://github.com/ccsb-scripps/AutoDock-Vina/releases
# and set the VINA_PATH environment variable to its location (or put it on PATH).
